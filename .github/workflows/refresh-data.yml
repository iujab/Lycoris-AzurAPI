name: Refresh Ship Data

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly fallback; primary trigger is repository_dispatch from azurlane-images
  workflow_dispatch:       # Manual trigger
  repository_dispatch:
    types: [azurlane-images-updated]

permissions:
  contents: write

jobs:
  refresh:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # AzurLaneTools/AzurLaneData (JSON) stopped updating on 2026-05-08. Its sibling
      # AzurLaneLuaScripts still updates daily, so we take the Lua tables from there
      # and convert them ourselves (scripts/lua2json.py), producing the same JSON
      # layout under upstream/azurlane-data that the ingest layer always read.
      - name: Sparse-clone upstream Lua scripts
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/AzurLaneTools/AzurLaneLuaScripts.git \
            upstream/azurlane-lua
          git -C upstream/azurlane-lua sparse-checkout init --cone
          git -C upstream/azurlane-lua sparse-checkout set \
            EN/sharecfg EN/sharecfgdata \
            CN/sharecfg CN/sharecfgdata \
            JP/sharecfg JP/sharecfgdata \
            versions
          git -C upstream/azurlane-lua checkout
          echo "upstream versions: EN=$(cat upstream/azurlane-lua/versions/EN.txt) CN=$(cat upstream/azurlane-lua/versions/CN.txt) JP=$(cat upstream/azurlane-lua/versions/JP.txt)"

      - name: Setup Python (for the Lua -> JSON converter)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert Lua tables to JSON
        run: |
          pip install --quiet lupa
          python -I scripts/lua2json.py upstream/azurlane-lua upstream/azurlane-data --regions EN,CN,JP

      - name: Clone images repo (filenames only, no blobs)
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/iujab/azurlane-images.git \
            ../azurlane-images
          cd ../azurlane-images
          mkdir -p paintings
          git ls-tree -r --name-only HEAD -- paintings/ | xargs touch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data
        run: npm run build:data

      - name: Verify data
        run: npm run verify

      - name: Commit and push if changed
        run: |
          git add data/
          # version.json's generatedAt changes every run; only commit when real data changed
          if git diff --cached --quiet -- . ':!data/version.json'; then
            echo "No data changes (only version.json timestamp); skipping commit"
            exit 0
          fi
          UPSTREAM_SHA=$(git -C upstream/azurlane-lua rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EN_VER=$(cat upstream/azurlane-lua/versions/EN.txt)
          git commit -m "chore: refresh ship data (EN ${EN_VER}, upstream ${UPSTREAM_SHA})"
          git push
